name: gastos_app
description: "Gastos Flutter - Personal finance manager"
publish_to: 'none'
version: 1.3.0+4

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.5.0
  riverpod_annotation: ^4.0.8

  # Routing
  go_router: ^14.2.0

  # Networking
  dio: ^5.4.3
  retrofit: ^4.10.0

  # Serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Local Database
  drift: ^2.35.4
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.6
  path: ^1.9.0

  # Secure Storage
  flutter_secure_storage: ^10.3.4
  shared_preferences: ^2.5.6

  # Charts
  fl_chart: ^1.3.1

  # Notifications
  flutter_local_notifications: ^23.0.1
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  app_settings: ^9.0.1

  # App info
  package_info_plus: ^10.2.2

  # Utils
  intl: ^0.20.3
  uuid: ^4.4.0
  equatable: ^3.0.0

  # Receipt Scanner & Parser
  mobile_scanner: ^7.5.0
  html: ^0.15.7

  # Connectivity
  connectivity_plus: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  riverpod_generator: ^4.0.10
  retrofit_generator: ^10.3.3
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  build_runner: ^2.17.1
  drift_dev: ^2.35.3
  mocktail: ^1.0.3
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
