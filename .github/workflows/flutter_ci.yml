name: Flutter CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Configurar mirror Maven Central e retry do Gradle
        run: |
          mkdir -p ~/.gradle/init.d
          cat << 'EOF' > ~/.gradle/init.d/maven-mirror.gradle
          import java.net.URI
          import org.gradle.api.artifacts.repositories.ArtifactRepository
          import org.gradle.api.artifacts.repositories.MavenArtifactRepository

          def mirror = URI.create("https://maven-central.storage-download.googleapis.com/maven2/")
          def rewrite = { ArtifactRepository repo ->
              if (repo instanceof MavenArtifactRepository) {
                  def u = repo.url?.toString() ?: ""
                  if (u.startsWith("https://repo.maven.apache.org/maven2") ||
                      u.startsWith("https://repo1.maven.org/maven2")) {
                      repo.setUrl(mirror)
                  }
              }
          }
          settingsEvaluated { settings ->
              settings.pluginManagement.repositories.all(rewrite)
              settings.dependencyResolutionManagement.repositories.all(rewrite)
          }
          projectsLoaded { g ->
              g.rootProject.allprojects { proj ->
                  proj.buildscript.repositories.all(rewrite)
                  proj.repositories.all(rewrite)
              }
          }
          EOF
          cat << 'EOF' >> ~/.gradle/gradle.properties
          systemProp.org.gradle.internal.http.retry.max.attempts=5
          systemProp.org.gradle.internal.http.connectionTimeout=60000
          systemProp.org.gradle.internal.http.socketTimeout=60000
          EOF

      - name: Restaurar Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.jks

      - name: Build APK (release assinado)
        run: |
          set -o pipefail
          flutter build apk --release \
            --build-name="2.0.${{ github.run_number }}" \
            --build-number="${{ github.run_number }}" 2>&1 | tee build_log.txt
        env:
          KEYSTORE_PATH: "release.jks"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build AAB (Play Store release assinado)
        run: |
          set -o pipefail
          flutter build appbundle --release \
            --build-name="2.0.${{ github.run_number }}" \
            --build-number="${{ github.run_number }}" 2>&1 | tee -a build_log.txt
        env:
          KEYSTORE_PATH: "release.jks"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Limpar keystore
        if: always()
        run: rm -f android/app/release.jks

      - name: Dump build log on failure
        if: failure()
        run: |
          echo "### Build Failure Log" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          tail -n 120 build_log.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB (Play Store)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-bundle
          path: build/app/outputs/bundle/release/app-release.aab
